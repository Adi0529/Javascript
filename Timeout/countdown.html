<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="p-3 text-center text-light bg-dark ">Count down</h1>
    <div class="mt-5 container w-50">
        <div class="form-floating mb-3 w-50 mx-auto">
            <input type="Number" class="form-control" id="hour" min="0" max="24" placeholder="">
            <label for="floatingInput">Hours</label>
        </div>
        <div class="form-floating mb-3 w-50 mx-auto">
            <input type="Number" class="form-control" id="minute" min="0" max="60" placeholder="">
            <label for="floatingInput">Minutes</label>
        </div>
        <div class="form-floating mb-3 w-50 mx-auto">
            <input type="Number" class="form-control" id="Second" min="0" max="60" placeholder="">
            <label for="floatingInput">Seconds</label>
        </div>
        <button class="btn btn-danger text-center mx-auto d-block px-2 fw-bolder fs-5" onclick="startcount()">Start</button>
    </div>

    <div class="result mt-5 text-center fw-bolder"><span class="p-4 bg-warning text-light me-2 fs-3" id="hours"></span>:
            <span class="p-4 bg-warning text-light mx-2 fs-3" id="minutes"></span>:
            <span class="p-4 bg-warning text-light ms-2 fs-3" id="seconds"></span>
    </div>
<script>


    function startcount() {
  
        hr = Number(document.getElementById("hour").value) || 0;
        min = Number(document.getElementById("minute").value) || 0;
        sec = Number(document.getElementById("Second").value) || 0;

        setInterval(runTimer, 1000);
    }

    function runTimer() {
        if (sec <= 0 && min <= 0 && hr > 0) {
            hr--; min = 59; sec = 59;
        } else if (sec <= 0 && min > 0) {
            sec = 59; min--;
        } else if (sec > 0) {
            sec--;
        } else {
            alert("Time is up!");

        }
        
        
        document.getElementById("hours").textContent = hr;
        document.getElementById("minutes").textContent = min;
        document.getElementById("seconds").textContent = sec;
    }
</script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
