<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aditya-Password generator</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container py-5">
    <h2> &#x1F510; Password Genertaor</h2> <br>
    <div class="mb-3">
        <label for="len" class="form-label">Password Length</label>
        <input type="text" class="form-control" id="length" aria-describedby="emailHelp w-50">

    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isNumber">
        <label class="form-check-label" for="isNumber">Input Numbers</label>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isupper">
        <label class="form-check-label" for="isupper">Input Uppercase</label>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isSpecial">
        <label class="form-check-label" for="isSpecial">Input Special Character</label>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="isambigious">
        <label class="form-check-label" for="isambigious">avoid ambigious</label>
    </div>
    <button type="submit" class="btn btn-primary" id="showres">Submit</button>
    <div class="mb-3">
        <label for="len" class="form-label"> Generated Password</label>
        <input type="password" class="form-control" id="result" aria-describedby="emailHelp w-50">

    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="pass">
        <label class="form-check-label" for="pass">Show Password</label>
    </div>
    <div class="progress">
        <div id="strengthBar" class="progress-bar" style="width:0%"></div>
    </div>
    <p id="strengthText" class="mt-2"></p>
    <button class="btn btn-outline-secondary" onclick="copyPassword()">Copy</button>

    <script src="Script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
