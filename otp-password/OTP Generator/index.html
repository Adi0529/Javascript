<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aditya-Otp Genter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-info ">
    <div class="container  d-flex flex-row mt-4 mb-5 align-items-center justify-content-center">
        <div class="d-flex flex-column gap-3 bg-light p-5 w-100 text-center rounded-5">
            <img src="./img/pass.png" alt="" class="w-30 mx-auto" style="max-width: 200px;">
            <h2 class="fw-bolder fs-1">Verification Code</h2>
            <p class="fs-3">We have send a verification code to your registered mobile number</p>
            <div class="container d-flex flex-row gap-3 w-50 py-2">
                <input type="text" size="1" mix-length="1" id="oneinput"class="from-control w-50 px-0 rounded-3 py-2 px-1 text-center" oninput="next('Twoinput')" >
                <input type="text" size="1" mix-length="1" id="Twoinput" class="from-control w-50 px-0 rounded-3 py-2 px-1 text-center" oninput="next('Threeinput')"  >
                <input type="text" size="1" mix-length="1" id="Threeinput" class="from-control w-50 px-0 rounded-3 py-2 px-1 text-center" oninput="next('Fourinput')">
                <input type="text" size="1" mix-length="1" id="Fourinput" class="from-control w-50 px-0 rounded-3 py-2 px-1 text-center" oninput="next('res')" >
            </div>
            <button class="btn btn-info w-50 mx-auto" id="res">Submit</button>

        </div>
        <div class="w-100 ">
            <p class="text-light ps-5 display-1 fw-bolder">OTP <br> VERIFICATION <br> FORM</p>
            <p class="text-light ps-5 fs-1">HTML,CSS & Javascript</p>
        </div>

    </div>
    <div class="container">
        <button id="otp">Genertae OTP</button>
    </div>
    <script src="Sciprt.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
