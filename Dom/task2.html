<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center bg-warning text-light p-3">To-DoList</h1>
    <div class="form-floating mx-auto mt-5 mb-3" style="width: 400px;">
        <input type="email" class="form-control border-dark fs-4" id="input" placeholder="Add new task">
        <label for="floatingInput">Add new task</label>
        <button class="text-center btn btn-success ms-3 mt-5" id="add">Add task</button>
    </div>
    <div class="mx-auto" style="width: 400px;">
        <ul id="result">

        </ul>
    </div>

    <script>
        
        btn1 = document.getElementById("add")
        list = document.getElementById("result")
        input=document.getElementById("input")
        btn1.addEventListener("click", () => {
        
        if (input.value.trim() !== "") {
            const listitem=document.createElement("li")
            listitem.innerHTML=`${input.value}
            <button class="btn btn-danger delete ms-2">delete</button>
            `
            list.appendChild(listitem)
            del=document.querySelector(".delete")
            del.addEventListener("click",()=>{
                list.removeChild(listitem)
            })
            input.value = "";
        }
        
        
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
