<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="text-center bg-warning p-3 ">Counter</h1>
    <div class="h-50 mx-auto text-center py-1 mt-5 bg-dark text-light"style="width: 100px;"><p id="counter" class="pt-2 pb-0 fs-3" >0</p></div>
    <div class="mt-5 d-flex flex-row gap-3 justify-content-center">
        <button class="btn btn-success text-center p-2" id="increment">Increment(+)</button>
        <button class="btn btn-danger text-center px-2 py-1" id="decrement">Decrement(-)</button>
        <button class="btn btn-dark text-center px-2 py-1" id="reset">Reset</button>
    </div>


    <script>
        count=0
        inc=document.getElementById("increment")
        dec=document.getElementById("decrement")
        reset=document.getElementById("reset")
        inc.addEventListener("click",()=>{
            count++
            document.getElementById("counter").textContent=count
        })
        dec.addEventListener("click",()=>{
            count--
            document.getElementById("counter").textContent=count
        })
        reset.addEventListener("click",()=>{
            count=0
            document.getElementById("counter").textContent=count
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
